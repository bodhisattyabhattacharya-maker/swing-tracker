  - { symbol: MSFT,  name: Microsoft,              theme: mega-cap-tech,      tag: cloud-ai,          bellwether: true }
  - { symbol: GOOGL, name: Alphabet,               theme: mega-cap-tech,      tag: cloud-ai-tpu,      bellwether: true }
  - { symbol: AMZN,  name: Amazon,                 theme: mega-cap-tech,      tag: cloud-retail,      bellwether: true }
