  # --- semi equipment ---
  - { symbol: ASML,  name: ASML Holding,           theme: semi-equipment,     tag: litho,             bellwether: true }
  - { symbol: AMAT,  name: Applied Materials,      theme: semi-equipment,     tag: wfe }
