# The watchlist. EDIT THIS FILE, not code.
# Add a line, commit, and the next nightly run backfills that symbol's history.
#
# TWO grouping fields, and they do different jobs:
#   theme  -> the peer group used for sector-relative ranks (params 20, 21).
#             Must have enough comparable members to mean anything.
#   tag    -> granular label for display and filtering only. Never used in a calculation.
#
# A theme marked `rankable: false` returns NULL for sector-relative ranks. That is deliberate:
# a null is honest, a rank computed across non-comparable companies is not.

themes:
  memory-storage:
    label: "Memory & storage"
    rankable: true
    note: "One commodity cycle. Strongest peer group in the list."
  ai-silicon:
    label: "AI silicon"
    rankable: true
    note: "AI compute and connectivity designers."
  semi-equipment:
    label: "Semi equipment"
    rankable: true
    note: "Near-perfect peers - same customers, same cycle."
  foundry-analog-ip:
    label: "Foundry, analog & IP"
    rankable: false
    note: "Mixed margin structures - a foundry, an analog maker and an IP licensor do not compare. Rank suppressed until we either split this or accept it."
  ai-infrastructure:
    label: "AI infrastructure"
    rankable: true
    note: "Servers, power and networking. Loose but defensible."
  mega-cap-tech:
    label: "Mega-cap tech"
    rankable: true
  diversified:
    label: "Diversified bellwethers"
    rankable: false
    note: "Not a peer group. Ranking a bank's FCF yield against a health insurer's is meaningless. Held for market context, not comparison."

tickers:
  # --- memory & storage ---
  - { symbol: MU,    name: Micron Technology,      theme: memory-storage,     tag: memory-hbm,        bellwether: true }
  - { symbol: SNDK,  name: SanDisk,                theme: memory-storage,     tag: nand }
