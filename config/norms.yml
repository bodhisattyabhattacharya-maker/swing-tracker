# Colour norms. EDIT THIS FILE, not code.
#
# A cell is shaded when it crosses one of these thresholds. Colour encodes OUR judgment,
# stated explicitly — the dashboard has no view of its own.
#
# Norms are set at BOTH ends wherever both ends matter, so a name stretched far above its
# normal range stands out as much as one that has fallen below it. That is what makes the
# sheet work for taking profits and not only for entries.
#
# These are first guesses. Expect to tighten them after a week of looking at real data.

norms:
  rsi_daily:        { low: 30,  high: 70 }
  # Widened from 45/65 on 2026-09-16, on measurement rather than taste. At 45/65 it flagged
  # **45.5% of judged cells** over the whole stored history against 12.0% for its daily sibling -
  # a colour on nearly half of what the column shows, which reads as background rather than signal.
  #
  # The cause was structural, not a bad number: the band was 20 points wide where the daily one is
  # 40, and weekly RSI spends most of its life in a trend rather than oscillating around 50. It was
  # NOT the close_vs_sma200w failure below - that one was 96% one-sided, a band no name could get
  # inside. This was 15.5% below / 30.0% above, genuinely two-sided and genuinely separating, just
  # too narrow. 40/70 targets roughly a quarter instead of a half.
  rsi_weekly:       { low: 40,  high: 70 }
  rsi_hourly:       { low: 30,  high: 70 }

  # Renamed from pct_off_ath on 2026-09-13. The parameter is `pct_off_high_stored` because the
  # data plan holds 5 years, not all time (INTC, QCOM and GE peaked in 2000) - and norms are
  # matched to parameters BY NAME, so a norm called pct_off_ath would have silently coloured
  # nothing at all. If the key here does not match a parameter, the cell is simply never judged.
  pct_off_high_stored: { low: -30 }         # 30%+ below the highest price we hold
  pct_off_52w_high: { low: -25 }

  close_vs_sma200d: { low: -5,  high: 40 }  # % distance from the daily 200 SMA
  close_vs_ema21w:  { low: -5,  high: 20 }  # % distance from the weekly 21 EMA

  # close_vs_sma200w had { low: 0, high: 10 } - "near long-term support = interesting" - and it was
  # REMOVED on 2026-09-15 when the column reached the grid and the intent was finally measured.
  # Across every complete week we hold, 87-90% of name-weeks sit above +10 in EVERY year, and only
  # ~4% ever land inside the band. That is structural rather than a market phase: distance above a
  # four-year mean says how long the universe has been rising, not something about the name. A
  # threshold that flags nine rows in ten is decoration, not judgment, so the column now ships
  # uncoloured. Removing the key here DELETES the row - the sync does that deliberately (see
  # norms.ts) - which is the whole reason this file is the source of truth.
  #
  # close_vs_sma30w is likewise uncoloured, for the duller reason that nobody has measured a
  # threshold for it yet. Range on 2026-09-07: -13.3 to +75.6, median +6.4.

  net_debt_ebitda:  { high: 4 }             # veto territory
  fcf_yield:        { low: 2,   high: 8 }   # percent
  rev_growth_yoy:   { low: 0 }
  rev_acceleration: { low: 0 }              # decelerating growth
  gross_margin_trend: { low: 0 }            # falling over four quarters

  # Renamed from rs_vs_spx_6m on 2026-09-16, closing the mismatch decision 0035 left open
  # deliberately. 126 trading bars is ABOUT six months and is not six months; a norm named for one
  # while judging the other is the labelling failure decision 0019 refused for ^SOX. Norms match
  # parameters BY NAME, so the old key judged nothing at all - the sync deletes that row and
  # inserts this one. `norms_without_parameter` in verify_parameters.sql stays at 12 across this
  # change: one key out, one key in. It falls to 11 when the column reaches the grid.
  rs_vs_spx_126b:   { low: 0 }              # lagging the market
  # rs_vs_sox_6m removed in decision 0019 - no free source for the PHLX Semiconductor Index.
  # Restore this line and the parameter together if we ever pay for index data.

  vix:              { low: 16,  high: 30 }  # hedge zone / scaling zone
  vix_term_struct:  { low: 0 }              # backwardation

# Factual states — NOT judgments. Rendered with an icon and a label, never colour alone.
flags:
  # Hours since the daily ingest last COMPLETED SUCCESSFULLY, before the dashboard calls itself
  # stale. Measures the pipeline, not the gap to the newest bar — otherwise a market holiday reads
  # as a failure and the banner cries wolf. 30 = one daily cycle plus six hours of slack.
  # Replaced stale_days_price on 2026-09-13; see the header of 20260913200000_freshness_from_runs.
  pipeline_stale_after_hours: 30
  stale_days_searched:   14
  min_bars_warning:      true   # suppress a value below its warm-up floor
