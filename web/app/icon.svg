<!--
  The tab icon. It exists because every browser asks for /favicon.ico on every page load and this
  app answered 404, which put an error in the console of a page whose entire premise is that
  nothing on it is unexplained. Next serves app/icon.svg at that route automatically.

  The mark is the page: a grid of cells, one of them marked. Four columns, three rows, and the
  single tinted cell is the "above" tone from the stylesheet - the only thing this product claims
  to do is tell you which cell is outside its band.

  THE THREE COLOURS BELOW ARE THE DARK PALETTE'S --paper, --ink-faint AND --above, copied by hand.
  An SVG served as its own file cannot read a custom property, so this is the one place in the app
  with a second copy of the palette; it went stale the day the Atelier skin landed and said so in
  its own comment - it claimed an ochre that no longer existed anywhere. If the tokens move again,
  move these too.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#16130f"/>
  <g fill="#6a6152">
    <rect x="6"  y="8"  width="5" height="4" rx="1"/>
    <rect x="13.5" y="8"  width="5" height="4" rx="1"/>
    <rect x="21" y="8"  width="5" height="4" rx="1"/>
    <rect x="6"  y="14" width="5" height="4" rx="1"/>
    <rect x="21" y="14" width="5" height="4" rx="1"/>
    <rect x="6"  y="20" width="5" height="4" rx="1"/>
    <rect x="13.5" y="20" width="5" height="4" rx="1"/>
    <rect x="21" y="20" width="5" height="4" rx="1"/>
  </g>
  <rect x="13.5" y="14" width="5" height="4" rx="1" fill="#82b68c"/>
</svg>
